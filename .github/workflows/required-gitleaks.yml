# Org-required secret scan. An org ruleset ("Require workflows to pass") runs
# this file in every repository on pull requests and merge-queue candidates,
# so a commit containing a secret cannot reach a default branch.
#
# It lives in this public repository because GitHub can require a workflow
# from a private repository only on private and internal repositories; from
# here it reaches public repositories too. The ruleset pins it by commit SHA.
#
# Scans only the commits being merged. A repo can tune findings with its own
# root .gitleaks.toml (default rules plus an allowlist); without one, the
# default rules apply.
name: Secret scan (org required)

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  gitleaks:
    # Private repos run on the org's self-hosted runners (the DF_RUNS_ON*
    # variables are shared only with private repos). A public repo has no such
    # variable and falls back to GitHub-hosted, which keeps pull-request code
    # from forks off self-hosted runners.
    runs-on: ${{ fromJSON(vars.DF_RUNS_ON_FAST || vars.DF_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum verified)
        run: |
          case "$(uname -m)" in
            aarch64|arm64) arch=arm64; sum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080 ;;
            *)             arch=x64;   sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
          esac
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${arch}.tar.gz"
          echo "${sum}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks && rm gl.tgz
      - name: Scan the commits being merged
        env:
          EVENT: ${{ github.event_name }}
          PR_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
          MQ_RANGE: ${{ github.event.merge_group.base_sha }}..${{ github.event.merge_group.head_sha }}
        run: |
          if [ "$EVENT" = "merge_group" ]; then range="$MQ_RANGE"; else range="$PR_RANGE"; fi
          config=()
          [ -f .gitleaks.toml ] && config=(--config .gitleaks.toml)
          ./gitleaks git . "${config[@]}" --redact --no-banner --log-opts="$range" --exit-code 1
